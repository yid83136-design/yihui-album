<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻紫星河 · 依慧专属相册</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #05020a 0%, #0d041a 35%, #1a0830 70%, #080211 100%);
            --panel-bg: rgba(22, 10, 42, 0.4);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8f4ff;
            --text-muted: #a895c4;
            --accent-glow: 0 0 30px rgba(199, 120, 248, 0.4);
            --accent-color: #dcb3ff;
            --cinematic-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.8), 
                inset 0 1px 1px rgba(255, 255, 255, 0.15), 
                inset 0 -1px 1px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, serif;
            user-select: none; 
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* --- 首屏与专属印记 --- */
        .hero-section {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            text-align: center;
            padding: 20px;
        }

        .exclusive-badge {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
            padding: 10px 35px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            border-radius: 40px;
            border: 1px solid rgba(220, 179, 255, 0.3);
            box-shadow: 0 10px 30px rgba(199, 120, 248, 0.2), inset 0 2px 5px rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            animation: badgeFloat 4s ease-in-out infinite;
        }

        .exclusive-badge::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 42px;
            background: linear-gradient(45deg, transparent, rgba(220, 179, 255, 0.6), transparent);
            z-index: -1;
            filter: blur(8px);
            opacity: 0.5;
            animation: borderShine 6s linear infinite;
        }

        .badge-text {
            font-size: 14px;
            letter-spacing: 8px;
            color: #fff;
            font-weight: 300;
            text-shadow: 0 0 10px rgba(220, 179, 255, 0.8);
        }

        .hero-title {
            font-size: 46px;
            font-weight: 200;
            letter-spacing: 14px;
            color: var(--text-main);
            text-shadow: 0 0 25px rgba(220, 179, 255, 0.6), 0 0 50px rgba(150, 70, 220, 0.4);
            margin-bottom: 25px;
        }

        .hero-subtitle {
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 5px;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 2;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 3px;
            cursor: pointer;
            animation: floatDown 2s infinite ease-in-out;
        }

        /* --- 导航栏 --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(8, 3, 16, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .logo { font-size: 18px; font-weight: 300; letter-spacing: 3px; color: var(--text-main); }
        .nav-tabs { display: flex; gap: 15px; }
        .tab-btn {
            background: transparent; border: 1px solid transparent; color: var(--text-muted);
            padding: 8px 24px; border-radius: 20px; cursor: pointer; font-size: 13px;
            letter-spacing: 1px; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .tab-btn.active, .tab-btn:hover { border-color: rgba(220, 179, 255, 0.4); color: #fff; background: rgba(220, 179, 255, 0.1); box-shadow: 0 0 20px rgba(220, 179, 255, 0.2); }

        /* --- 主体内容 --- */
        .container { max-width: 1500px; margin: 0 auto; padding: 50px 20px; }
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.6s ease; }
        .category-filter { display: flex; justify-content: center; gap: 15px; margin-bottom: 50px; flex-wrap: wrap; }
        .filter-btn { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-muted); padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: all 0.3s ease; font-size: 13px; letter-spacing: 1px; }
        .filter-btn.active, .filter-btn:hover { background: rgba(220, 179, 255, 0.15); border-color: rgba(220, 179, 255, 0.5); color: #fff; box-shadow: 0 0 20px rgba(220, 179, 255, 0.25); }

        /* --- 瀑布流画框 --- */
        .masonry-grid { column-count: 4; column-gap: 35px; width: 100%; }
        @media (max-width: 1300px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 900px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 600px) { .masonry-grid { column-count: 1; } }

        .photo-item {
            break-inside: avoid; margin-bottom: 35px;
            background: linear-gradient(145deg, rgba(35, 18, 60, 0.4) 0%, rgba(15, 6, 30, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06); border-top-color: rgba(255, 255, 255, 0.15); border-left-color: rgba(255, 255, 255, 0.1);
            border-radius: 18px; padding: 16px; position: relative; box-shadow: var(--cinematic-shadow);
            backdrop-filter: blur(12px); transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); cursor: pointer; opacity: 0; transform: translateY(50px);
        }
        .photo-item::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 18px; box-shadow: inset 0 0 40px rgba(199, 120, 248, 0.05); pointer-events: none; transition: all 0.5s ease; }
        .photo-item.visible { opacity: 1; transform: translateY(0); }
        .photo-item:hover { transform: translateY(-10px) scale(1.02); border-color: rgba(220, 179, 255, 0.4); border-top-color: rgba(255, 255, 255, 0.5); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 0 40px rgba(199, 120, 248, 0.3), 0 0 80px rgba(150, 70, 220, 0.15); }
        .photo-item:hover::before { box-shadow: inset 0 0 60px rgba(199, 120, 248, 0.15); }

        .photo-inner-wrap { width: 100%; border-radius: 8px; overflow: hidden; position: relative; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .photo-item img { width: 100%; display: block; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); filter: brightness(0.95) contrast(1.05); }
        .photo-item:hover img { transform: scale(1.05); filter: brightness(1.05) contrast(1.05); }
        .photo-info { margin-top: 15px; padding: 0 4px; display: flex; justify-content: space-between; align-items: center; }
        .photo-tag { font-size: 10px; background: rgba(255, 255, 255, 0.05); color: var(--accent-color); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(220, 179, 255, 0.15); letter-spacing: 1px; }

        /* --- 管理后台与批量选择样式 --- */
        .admin-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px; padding: 40px; backdrop-filter: blur(20px); box-shadow: var(--cinematic-shadow); }
        .upload-zone { border: 1px dashed rgba(220, 179, 255, 0.4); border-radius: 16px; padding: 60px 40px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, transparent 100%); margin-bottom: 30px; }
        .upload-zone:hover { border-color: var(--accent-color); background: rgba(220, 179, 255, 0.05); box-shadow: inset 0 0 30px rgba(199, 120, 248, 0.1); }
        .upload-zone p { color: var(--text-muted); margin-top: 15px; font-size: 13px; letter-spacing: 1px; }
        .batch-progress-container { margin-top: 15px; display: none; background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 20px; text-align: left; max-height: 200px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); box-shadow: inset 0 5px 20px rgba(0,0,0,0.5); }
        .progress-item { font-size: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
        .progress-item.success { color: #c4ffc4; }

        .manage-grid { margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .manage-card { background: rgba(15, 6, 30, 0.7); border: 2px solid transparent; border-radius: 14px; padding: 12px; transition: all 0.2s ease; cursor: pointer; position: relative; }
        .manage-card.selected { border-color: var(--accent-color); background: rgba(220, 179, 255, 0.1); box-shadow: 0 0 20px rgba(199, 120, 248, 0.3); }
        .manage-card::after { content: '✓'; position: absolute; top: 20px; right: 20px; width: 24px; height: 24px; background: var(--accent-color); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; opacity: 0; transform: scale(0.5); transition: all 0.2s ease; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .manage-card.selected::after { opacity: 1; transform: scale(1); }
        .manage-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; pointer-events: none; }
        .manage-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }

        /* --- 自定义右键菜单 --- */
        #contextMenu { position: fixed; background: rgba(20, 10, 35, 0.95); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 20px rgba(199, 120, 248, 0.15); padding: 10px 0; min-width: 200px; z-index: 9999; display: none; opacity: 0; transform: scale(0.95); transition: opacity 0.15s, transform 0.15s; }
        #contextMenu.show { display: block; opacity: 1; transform: scale(1); }
        .menu-title { padding: 5px 20px 10px; font-size: 11px; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 5px; letter-spacing: 1px; }
        .menu-item { padding: 10px 20px; font-size: 13px; color: var(--text-main); cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover { background: rgba(220, 179, 255, 0.15); color: var(--accent-color); }
        .menu-input-wrapper { padding: 10px 15px; display: flex; gap: 8px; }
        .menu-input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; padding: 6px 10px; font-size: 12px; outline: none; }
        .menu-input:focus { border-color: var(--accent-color); }
        .menu-btn { background: rgba(220, 179, 255, 0.2); border: none; color: #fff; border-radius: 6px; padding: 0 10px; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { background: rgba(220, 179, 255, 0.4); }
        .menu-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 5px 0; }

        /* --- 灯箱区与留言区 --- */
        .lightbox { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(2, 1, 6, 0.98); backdrop-filter: blur(30px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 30px; }
        .lightbox.active { display: flex; animation: fadeIn 0.4s ease; }
        .lightbox-wrapper { display: flex; max-width: 1300px; width: 100%; height: 85vh; background: #000; border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.9); }
        .lightbox-img-side { flex: 1.8; display: flex; align-items: center; justify-content: center; position: relative; }
        .lightbox-img-side img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .lightbox-info-side { flex: 1; padding: 40px; display: flex; flex-direction: column; background: linear-gradient(180deg, rgba(20, 10, 35, 1) 0%, rgba(10, 4, 18, 1) 100%); border-left: 1px solid rgba(255,255,255,0.05); }
        .lightbox-close { position: absolute; top: 25px; right: 25px; background: rgba(255,255,255,0.05); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 18px; z-index: 10; transition: all 0.3s; }
        .lightbox-close:hover { background: rgba(220, 179, 255, 0.2); transform: rotate(90deg); }
        
        /* 留言区 CSS */
        .comments-section { flex: 1; display: flex; flex-direction: column; min-height: 220px; margin-top: 15px; }
        .comments-list { flex: 1; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; max-height: 450px; }
        .comments-list::-webkit-scrollbar { width: 6px; }
        .comments-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        
        .comment-item { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 14px; margin-bottom: 12px; font-size: 13px; border: 1px solid rgba(255,255,255,0.04); line-height: 1.6; }
        .comment-item .time { font-size: 10px; color: var(--text-muted); margin-top: 6px; text-align: right; }
        .comment-input-box { display: flex; gap: 10px; margin-top: auto; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes floatDown { 0%, 100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(12px); opacity: 1; } }
        @keyframes badgeFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes borderShine { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <section class="hero-section" id="heroView">
        <div class="exclusive-badge">
            <span class="badge-text">依慧专属</span>
        </div>
        <h1 class="hero-title">幻紫星河 · 梦幻空间</h1>
        <p class="hero-subtitle">星空璀璨，记录每一个不可复制的瞬间。<br>在这里，光学与记忆交织，封存所有的高光轨迹 ✦</p>
        <div class="scroll-indicator" onclick="scrollToGallery()">
            <p>向下滑动 开启星河</p>
            <span>✨</span>
        </div>
    </section>

    <header id="mainHeader">
        <div class="logo">星河明镜 ✧</div>
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="switchPage('galleryPage')">相册展厅</button>
            <button class="tab-btn" onclick="switchPage('adminPage')">星空管理台</button>
        </nav>
    </header>

    <div class="container">
        <section id="galleryPage" class="page-section active">
            <div class="category-filter" id="categoryFilter"></div>
            <div class="masonry-grid" id="galleryGrid"></div>
        </section>

        <section id="adminPage" class="page-section">
            <div class="admin-panel">
                <h2 style="margin-bottom: 25px; font-weight: 300; letter-spacing: 2px;">无限制批量矩阵上传</h2>
                <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                    <span style="font-size: 50px; display: block; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(199, 120, 248, 0.5));">🔮</span>
                    <p id="uploadStatus">点击此处框选多张照片进行无限制上传<br><span style="font-size: 11px; opacity: 0.6; margin-top: 8px; display: block;">*上传后可右键进行批量分类</span></p>
                    <input type="file" id="fileInput" accept="image/*" multiple onchange="handleBatchFileUpload(event)">
                </div>
                <div class="batch-progress-container" id="batchProgressBox"></div>
                <div style="display: flex; justify-content: space-between; align-items: flex-end; margin: 50px 0 25px 0;">
                    <h2 style="font-weight: 300; letter-spacing: 2px; margin: 0;">资产全景级联维护</h2>
                    <span style="font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 12px;">操作提示：左键单击选中，右键批量操作</span>
                </div>
                <div class="manage-grid" id="adminGrid"></div>
            </div>
        </section>
    </div>

    <div id="contextMenu">
        <div class="menu-title" id="contextMenuTitle">已选择 0 项</div>
        <div id="existingCategoriesMenu"></div>
        <div class="menu-divider"></div>
        <div class="menu-input-wrapper">
            <input type="text" id="newCategoryInput" class="menu-input" placeholder="输入新分类名称...">
            <button class="menu-btn" onclick="applyNewCategory()">✓</button>
        </div>
        <div class="menu-divider"></div>
        <div class="menu-item" onclick="clearSelection()" style="color: #a895c4;">⊘ 取消选中状态</div>
        <div class="menu-item" onclick="batchDelete()" style="color: #ff7676;">🗑️ 批量抹除选中资产</div>
    </div>

    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <div class="lightbox-wrapper">
            <div class="lightbox-img-side"><img id="lightboxImg" src=""></div>
            <div class="lightbox-info-side">
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <span class="photo-tag" id="lightboxTag">分类</span>
                    <a id="downloadBtn" href="#" target="_blank" download="starry.jpg" style="color: #fff; text-decoration: none; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 8px; font-size: 12px; transition: background 0.3s;">💾 原图提取</a>
                </div>
                
                <div class="comments-section">
                    <h3 style="margin-bottom: 20px; font-weight: 400; font-size: 15px; color: var(--accent-color); border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 10px;">✨ 星河留影私语</h3>
                    <div class="comments-list" id="commentsList">
                        </div>
                    <div class="comment-input-box">
                        <input type="text" id="commentInput" class="menu-input" placeholder="写下属于这一刻的温柔私语..." style="flex: 1; padding: 10px 15px;">
                        <button class="menu-btn" onclick="submitComment()" style="padding: 0 18px;">留影</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ⚠️ 安全说明：请勿在代码中硬编码 API Key（公开仓库会被 GitHub 密钥扫描拦截）。
        // 首次使用请在浏览器控制台执行（密钥仅保存在你自己的浏览器中）：
        //   localStorage.setItem('IMGBB_API_KEY', '你的ImgBB API Key');
        const IMGBB_API_KEY = localStorage.getItem('IMGBB_API_KEY') || '';
        let albumData = JSON.parse(localStorage.getItem('fairy_album_db')) || [];
        let selectedPhotoIds = new Set(); 
        let currentActiveLightboxId = null; // 追踪当前打开的灯箱图片ID

        window.addEventListener('DOMContentLoaded', () => {
            initStarfield();
            renderGallery();
            renderAdminGrid();
            updateCategoryFilters();
            
            document.addEventListener('click', (e) => {
                if(!e.target.closest('#contextMenu')) hideContextMenu();
            });
            
            // 绑定留言输入框回车键
            document.getElementById('commentInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') submitComment();
            });
        });

        function scrollToGallery() {
            const headerPosition = document.getElementById('mainHeader').getBoundingClientRect().top + window.pageYOffset;
            window.scrollTo({ top: headerPosition, behavior: "smooth" });
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');
            
            if(pageId === 'galleryPage') renderGallery();
            else renderAdminGrid();
        }

        function initStarfield() {
            const canvas = document.getElementById('starfield');
            const ctx = canvas.getContext('2d');
            let stars = [];
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            for (let i = 0; i < 150; i++) {
                stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 1.5, alpha: Math.random(), speed: 0.01 + Math.random() * 0.02 });
            }
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                    star.alpha += star.speed;
                    if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                    ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(220, 179, 255, ${Math.max(0, star.alpha)})`; ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        async function handleBatchFileUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const statusEl = document.getElementById('uploadStatus');
            const progressBox = document.getElementById('batchProgressBox');
            progressBox.innerHTML = ''; progressBox.style.display = 'block';
            statusEl.innerHTML = `🔮 矩阵链接中，共 ${files.length} 项资产正在进行光学重构...`;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const itemProgress = document.createElement('div');
                itemProgress.className = 'progress-item';
                itemProgress.innerHTML = `<span>[${i+1}/${files.length}] ${file.name}</span> <span class="state">重构中...</span>`;
                progressBox.appendChild(itemProgress);
                progressBox.scrollTop = progressBox.scrollHeight;

                const formData = new FormData(); formData.append('image', file);

                try {
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                    const result = await response.json();
                    if (result.success) {
                        albumData.unshift({
                            id: (Date.now() + i).toString(),
                            url: result.data.url,
                            thumb: result.data.thumb.url,
                            category: "未分类",
                            showOnMain: true,
                            timestamp: new Date().toLocaleDateString(),
                            comments: [] 
                        });
                        saveData();
                        itemProgress.classList.add('success');
                        itemProgress.querySelector('.state').innerText = '✨ 成功';
                    }
                } catch (error) { console.error(error); }
            }
            statusEl.innerHTML = `✨ 队列批处理结束，新资产已加入星河。<br><span style="font-size: 11px; opacity: 0.6; margin-top: 8px; display: block;">*请在下方使用右键进行批量分类</span>`;
            renderAdminGrid(); updateCategoryFilters();
            setTimeout(() => { progressBox.style.display = 'none'; statusEl.innerHTML = "点击此处框选多张照片进行无限制上传<br><span style='font-size: 11px; opacity: 0.6; margin-top: 8px; display: block;'>*上传后可右键进行批量分类</span>"; }, 5000);
        }

        function saveData() { localStorage.setItem('fairy_album_db', JSON.stringify(albumData)); }

        function updateCategoryFilters() {
            const filterContainer = document.getElementById('categoryFilter');
            const categories = ['全部', ...new Set(albumData.map(p => p.category))];
            filterContainer.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${cat === '全部' ? 'active' : ''}`;
                btn.innerText = cat === '全部' ? '全景视界' : cat;
                btn.onclick = (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active'); renderGallery(cat);
                };
                filterContainer.appendChild(btn);
            });
        }

        function renderGallery(filterCat = '全部') {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            const filtered = albumData.filter(p => p.showOnMain && (filterCat === '全部' || p.category === filterCat));

            if(filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 80px; font-weight: 300; font-size: 14px; letter-spacing: 2px;">当前频段未检测到光学记忆 ✦</div>`;
                return;
            }

            filtered.forEach(photo => {
                const item = document.createElement('div');
                item.className = 'photo-item';
                item.onclick = () => openLightbox(photo.id);
                item.innerHTML = `
                    <div class="photo-inner-wrap"><img src="${photo.url}" loading="lazy"></div>
                    <div class="photo-info">
                        <span class="photo-tag">${photo.category}</span>
                        <span style="font-size: 10px; color: rgba(255,255,255,0.2); letter-spacing: 2px;">✦ ✧ ✦</span>
                    </div>
                `;
                grid.appendChild(item);
            });
            setupScrollAnimation();
        }

        function renderAdminGrid() {
            const grid = document.getElementById('adminGrid');
            grid.innerHTML = '';

            if(albumData.length === 0) return;

            albumData.forEach(photo => {
                const card = document.createElement('div');
                card.className = `manage-card ${selectedPhotoIds.has(photo.id) ? 'selected' : ''}`;
                card.id = `card-${photo.id}`;
                
                card.innerHTML = `
                    <img src="${photo.thumb || photo.url}">
                    <div style="font-size: 12px; margin-bottom: 8px; color: ${photo.category === '未分类' ? '#ff9b9b' : 'var(--accent-color)'};">
                        [ ${photo.category} ]
                    </div>
                    <div class="manage-controls">
                        <label class="checkbox-label" onclick="event.stopPropagation()">
                            <input type="checkbox" ${photo.showOnMain ? 'checked' : ''} onchange="toggleMainShow('${photo.id}', this.checked)"> 展厅呈现
                        </label>
                    </div>
                `;

                card.addEventListener('click', (e) => {
                    if(e.target.tagName === 'INPUT') return;
                    if(selectedPhotoIds.has(photo.id)) {
                        selectedPhotoIds.delete(photo.id);
                        card.classList.remove('selected');
                    } else {
                        selectedPhotoIds.add(photo.id);
                        card.classList.add('selected');
                    }
                });

                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault(); 
                    if(!selectedPhotoIds.has(photo.id)) {
                        selectedPhotoIds.clear();
                        selectedPhotoIds.add(photo.id);
                        document.querySelectorAll('.manage-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                    }
                    showContextMenu(e);
                });

                grid.appendChild(card);
            });
            
            grid.addEventListener('contextmenu', (e) => {
                if(e.target === grid) e.preventDefault();
            });
        }

        function showContextMenu(e) {
            const menu = document.getElementById('contextMenu');
            document.getElementById('contextMenuTitle').innerText = `批量操作 ${selectedPhotoIds.size} 项资产`;
            
            const categoriesListMenu = document.getElementById('existingCategoriesMenu');
            categoriesListMenu.innerHTML = '';
            const existingCategories = [...new Set(albumData.map(p => p.category))].filter(c => c !== '未分类');
            
            if(existingCategories.length > 0) {
                existingCategories.forEach(cat => {
                    const item = document.createElement('div');
                    item.className = 'menu-item';
                    item.innerHTML = `<span>📁 移至 [ ${cat} ]</span>`;
                    item.onclick = () => applyCategoryToSelected(cat);
                    categoriesListMenu.appendChild(item);
                });
            } else {
                categoriesListMenu.innerHTML = `<div style="padding: 10px 20px; font-size: 11px; color: #666;">暂无已建分类</div>`;
            }

            document.getElementById('newCategoryInput').value = '';

            let x = e.clientX;
            let y = e.clientY;
            menu.style.display = 'block';
            if (x + menu.offsetWidth > window.innerWidth) x = window.innerWidth - menu.offsetWidth - 10;
            if (y + menu.offsetHeight > window.innerHeight) y = window.innerHeight - menu.offsetHeight - 10;
            
            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
            
            setTimeout(() => menu.classList.add('show'), 10);
        }

        function hideContextMenu() {
            const menu = document.getElementById('contextMenu');
            menu.classList.remove('show');
            setTimeout(() => menu.style.display = 'none', 150);
        }

        function applyCategoryToSelected(categoryName) {
            if(selectedPhotoIds.size === 0) return;
            albumData.forEach(photo => {
                if(selectedPhotoIds.has(photo.id)) {
                    photo.category = categoryName;
                }
            });
            saveData();
            clearSelection(); 
            renderAdminGrid();
            updateCategoryFilters();
            hideContextMenu();
        }

        function applyNewCategory() {
            const val = document.getElementById('newCategoryInput').value.trim();
            if(val) applyCategoryToSelected(val);
        }

        function clearSelection() {
            selectedPhotoIds.clear();
            document.querySelectorAll('.manage-card').forEach(c => c.classList.remove('selected'));
            hideContextMenu();
        }

        function batchDelete() {
            if(confirm(`警告：确定要永久抹除这 ${selectedPhotoIds.size} 项星空资产吗？`)) {
                albumData = albumData.filter(p => !selectedPhotoIds.has(p.id));
                saveData();
                clearSelection();
                renderAdminGrid();
                updateCategoryFilters();
            }
        }

        function toggleMainShow(id, isChecked) {
            const photo = albumData.find(p => p.id === id);
            if(photo) { photo.showOnMain = isChecked; saveData(); }
        }

        function setupScrollAnimation() {
            const items = document.querySelectorAll('.photo-item');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
                });
            }, { threshold: 0.05 });
            items.forEach(item => observer.observe(item));
        }

        /* --- 留言与灯箱核心逻辑 --- */
        function openLightbox(id) {
            const photo = albumData.find(p => p.id === id);
            if (!photo) return;
            
            currentActiveLightboxId = id; 
            document.getElementById('lightboxImg').src = photo.url;
            document.getElementById('lightboxTag').innerText = photo.category;
            document.getElementById('downloadBtn').href = photo.url;
            
            renderComments(photo.comments); 
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() { 
            document.getElementById('lightbox').classList.remove('active'); 
            currentActiveLightboxId = null;
        }

        function renderComments(comments = []) {
            const box = document.getElementById('commentsList');
            box.innerHTML = '';
            
            if(comments.length === 0) {
                box.innerHTML = `<div style="text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 40px; font-weight: 300; letter-spacing: 1px;">这片星空尚无人造访，写下第一句倾听吧...</div>`;
                return;
            }
            
            comments.forEach(c => {
                const div = document.createElement('div');
                div.className = 'comment-item';
                div.innerHTML = `<div>${c.text}</div><div class="time">${c.time}</div>`;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight; 
        }

        function submitComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if(!text || !currentActiveLightboxId) return;

            const photo = albumData.find(p => p.id === currentActiveLightboxId);
            if(photo) {
                if(!photo.comments) photo.comments = [];
                photo.comments.push({
                    text: text,
                    time: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                });
                
                saveData(); 
                renderComments(photo.comments); 
                input.value = ''; 
            }
        }
    </script>
</body>
</html>
